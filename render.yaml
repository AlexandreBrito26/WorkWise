# Blueprint do Render: cria o banco Postgres e o serviço da API.
# Confira os planos e limites atuais em render.com/pricing antes de escolher.
databases:
  - name: workwise-db
    databaseName: workwise
    plan: free

services:
  - type: web
    name: workwise-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: workwise-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        sync: false        # URL do front na Vercel, ex.: https://workwise.vercel.app
      - key: GROQ_API_KEY
        sync: false        # opcional
